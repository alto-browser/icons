name: PR preview

on:
  workflow_run:
    workflows: ["PR check"]
    types: [completed]
  pull_request_target:
    types: [closed]

permissions: {}

concurrency:
  group: previews-branch
  cancel-in-progress: false

jobs:
  comment:
    name: comment
    if: github.event_name == 'workflow_run' && github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
      pull-requests: write
    steps:
      - name: Check out the scripts
        uses: actions/checkout@v4
        with:
          sparse-checkout: scripts

      - name: Download the report and previews
        id: download
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: pr-assets
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: incoming

      - name: Read the pull request details
        id: pr
        run: |
          if [ ! -f incoming/pr-number.txt ] || [ ! -f incoming/head-sha.txt ]; then
            echo "No artifact was produced by the triggering run, so there is nothing to comment."
            echo "found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          number=$(tr -dc '0-9' < incoming/pr-number.txt)
          head=$(tr -dc '0-9a-f' < incoming/head-sha.txt)
          if [ -z "$number" ] || [ -z "$head" ]; then
            echo "::warning::Artifact is missing the pull request details."
            echo "found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "found=true" >> "$GITHUB_OUTPUT"
          echo "number=$number" >> "$GITHUB_OUTPUT"
          echo "prefix=pr/$number/${head:0:12}" >> "$GITHUB_OUTPUT"

      - name: Publish the previews
        id: publish
        if: steps.pr.outputs.found == 'true'
        env:
          PREFIX: ${{ steps.pr.outputs.prefix }}
          REPO: ${{ github.repository }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$(find incoming -maxdepth 1 -name '*.png' -print -quit)" ]; then
            echo "No previews were rendered."
            echo "raw=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git init -q previews
          cd previews
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add origin "https://x-access-token:${TOKEN}@github.com/${REPO}.git"
          if git fetch -q --depth 1 origin previews 2>/dev/null; then
            git checkout -q -b previews FETCH_HEAD
          else
            git checkout -q --orphan previews
          fi

          # Replace everything stored for this pull request, so a long-lived
          # branch does not accumulate one directory per push.
          pr_dir=${PREFIX%/*}
          rm -rf "$pr_dir"
          mkdir -p "$PREFIX"
          cp ../incoming/*.png "$PREFIX/"
          git add -A "$pr_dir"
          if git diff --quiet --cached; then
            echo "Previews are already published."
          else
            git commit -q -m "Previews for $PREFIX"
            git push -q origin previews
          fi
          echo "raw=https://raw.githubusercontent.com/${REPO}/previews/${PREFIX}" >> "$GITHUB_OUTPUT"

      - name: Build the comment
        if: steps.pr.outputs.found == 'true'
        env:
          RAW: ${{ steps.publish.outputs.raw }}
        run: bash scripts/build-preview-comment.sh incoming "$RAW" > comment.md

      - name: Post or update the comment
        if: steps.pr.outputs.found == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('comment.md', 'utf8');
            const marker = '<!-- dock-icons-preview -->';
            const issue_number = Number('${{ steps.pr.outputs.number }}');
            const { owner, repo } = context.repo;

            const comments = await github.paginate(
              github.rest.issues.listComments,
              { owner, repo, issue_number, per_page: 100 },
            );
            const mine = comments.find(
              (c) => c.user.type === 'Bot' && c.body && c.body.includes(marker),
            );

            if (mine) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: mine.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

  cleanup:
    name: cleanup
    if: github.event_name == 'pull_request_target'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Drop the previews for the closed pull request
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          number=$(printf '%s' "$PR_NUMBER" | tr -dc '0-9')
          [ -n "$number" ] || exit 0

          git init -q previews
          cd previews
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add origin "https://x-access-token:${TOKEN}@github.com/${REPO}.git"
          if ! git fetch -q --depth 1 origin previews 2>/dev/null; then
            echo "There is no previews branch yet."
            exit 0
          fi
          git checkout -q -b previews FETCH_HEAD
          if [ ! -d "pr/$number" ]; then
            echo "No previews stored for pull request #$number."
            exit 0
          fi
          git rm -rq "pr/$number"
          git commit -q -m "Drop previews for #$number"
          git push -q origin previews
